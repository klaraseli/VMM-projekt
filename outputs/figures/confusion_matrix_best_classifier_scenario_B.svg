ont-weight="bold" fill="#ffffff">423</text><text x="397.5" y="334.0" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Specificita: 77.0 %</text><text x="397.5" y="354.0" text-anchor="middle" font-size="10" fill="#e2e8f0">(65.2 % z celku)</text>

